name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite deploy manual pelo GitHub

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Rodar testes
        run: mvn clean test -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          GOOGLE_CLIENT_ID: fake-id
          GOOGLE_CLIENT_SECRET: fake-secret

  deploy:
    name: Deploy Railway
    needs: test  # Só roda se testes passarem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: |
          cd backend
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
